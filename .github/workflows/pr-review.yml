name: Codebase Copilot PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check for an LLM key
        id: keys
        run: |
          if [ -n "$GOOGLE_API_KEY$ANTHROPIC_API_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "No LLM API key secret set; skipping review."; fi

      - uses: actions/checkout@v4
        if: steps.keys.outputs.ok == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.keys.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Cache Hugging Face models
        if: steps.keys.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-v1

      - name: Install dependencies
        if: steps.keys.outputs.ok == 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # Review against the code in this PR, not a stale committed index
      - name: Index the checked-out code
        if: steps.keys.outputs.ok == 'true'
        run: python -m ingestion.indexer .

      - name: Get PR diff
        if: steps.keys.outputs.ok == 'true'
        run: git diff ${{ github.event.pull_request.base.sha }} HEAD > pr_diff.txt

      - name: Run review agent
        if: steps.keys.outputs.ok == 'true'
        run: |
          python - <<'PY'
          from agents.review_agent import ReviewAgent
          diff = open("pr_diff.txt", encoding="utf-8").read()
          if len(diff) > 60000:
              diff = diff[:60000] + "\n... (diff truncated)"
          review = ReviewAgent().review_diff(diff)
          open("review_output.txt", "w", encoding="utf-8").write(review)
          PY

      - name: Comment on the PR
        if: steps.keys.outputs.ok == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reviewText = fs.readFileSync('review_output.txt', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "### 🤖 Codebase Copilot Review\n\n" + reviewText
            });
